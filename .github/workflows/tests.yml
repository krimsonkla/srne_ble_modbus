name: Tests

# Runs the pytest suite on every PR into main and every push to main.
# The suite depends on pytest-homeassistant-custom-component, which pins
# an exact Home Assistant version (see requirements.txt and
# tests/requirements.txt) — the plugin, HA, aiodns, pydantic, and dbus-fast
# must move together.
#
# Wire this workflow into the "Tests" required status check on main once
# the first successful run has completed.
on:
  pull_request:
    branches:
      - main
      - jmr/SRNE-002-ble-reliability-and-observability
      - jmr/SRNE-002-test-fixes
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.12, HA 2025.1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          # Cache pip's download directory keyed on the requirements files.
          # A miss is fine; we just re-download from PyPI.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install runtime deps first so pytest-HA's exact-version pin on
          # homeassistant resolves cleanly against the same HA version.
          pip install -r requirements.txt
          pip install -r tests/requirements.txt

      - name: Run pytest
        env:
          # pytest-homeassistant-custom-component patches platform.system() to
          # "Linux" for its bluetooth-adapter simulation; on Linux runners this
          # is a no-op, but the same fixture path is used and matches local
          # macOS behavior.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest --tb=short -q
